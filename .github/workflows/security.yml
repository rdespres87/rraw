name: Security

on:
  push:
    branches: [ main ]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - .github/workflows/security.yml
  pull_request:
    branches: [ main ]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - .github/workflows/security.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit
