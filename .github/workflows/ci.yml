name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-format-clippy:
    name: Code Formatting & Strict Clippy Lints
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: swatinem/rust-cache@v2

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Verify zero-warning workspace lints (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-workspace:
    name: Workspace Unit & Integration Tests (macOS)
    runs-on: macos-latest
    needs: check-format-clippy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build artifacts
        uses: swatinem/rust-cache@v2

      - name: Execute all workspace unit & integration test suites
        run: cargo test --workspace --verbose

  coverage-core:
    name: Core Crates Code Coverage (cargo-llvm-cov >= 82%)
    runs-on: macos-latest
    needs: check-format-clippy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain with llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo dependencies and build artifacts
        uses: swatinem/rust-cache@v2

      - name: Run core CPU DSP coverage with >= 82% line threshold
        # Note: GitHub-hosted macos-latest VMs lack Metal GPU passthrough, so
        # rraw-gpu shader tests skip on CI and would artificially drop coverage.
        # Full 5-crate coverage (including rraw-gpu) is >= 85% on bare-metal Apple Silicon.
        run: |
          cargo llvm-cov \
            --package rraw-core \
            --package rraw-color \
            --package rraw-optics \
            --package rraw-decode \
            --fail-under-lines 82 \
            --lcov \
            --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload LCOV coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-core-crates
          path: lcov.info
          retention-days: 14
