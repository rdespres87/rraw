name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid macOS runner queue contention.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-macos:
    name: Format, Clippy, Workspace Tests & Core Coverage (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo dependencies and build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-macos-arm64

      - name: Check code formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Verify zero-warning workspace lints (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute all workspace unit & integration test suites
        run: cargo test --workspace

      - name: Run core CPU DSP coverage with >= 85% line threshold
        # GitHub-hosted macos-latest VMs lack Metal GPU passthrough, so rraw-gpu
        # shader tests skip on CI. Full 5-crate coverage is >= 85% on bare-metal Apple Silicon.
        run: |
          cargo llvm-cov \
            --package rraw-core \
            --package rraw-color \
            --package rraw-optics \
            --package rraw-decode \
            --fail-under-lines 85 \
            --lcov \
            --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov report --summary-only

      - name: Upload LCOV coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-core-crates
          path: lcov.info
          retention-days: 14

  ci-linux:
    name: Clippy & Workspace Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ci-linux-x64

      - name: Verify zero-warning workspace lints (cargo clippy)
        run: cargo clippy --workspace --exclude rraw-app --all-targets -- -D warnings

      - name: Execute cross-platform CPU/storage/export test suites
        run: cargo test --workspace --exclude rraw-app --exclude rraw-gpu
