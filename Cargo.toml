[workspace]
resolver = "2"
members = [
    "crates/rraw-core",
    "crates/rraw-decode",
    "crates/rraw-optics",
    "crates/rraw-color",
    "crates/rraw-gpu",
    "crates/rraw-ai",
    "crates/rraw-storage",
    "crates/rraw-export",
    "crates/rraw-macos-edr",
    "crates/rraw-coreml",
    "crates/rraw-cli",
    "crates/rraw-app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Rraw Contributors"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
glam = "0.34"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSScreen", "objc2-core-foundation"] }
png = "0.17"
pollster = "1.0"
quick-xml = "0.37"
rawler = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = { version = "0.10", default-features = false }
rayon = "1.12"
wgpu = "30.0"
rraw-core = { path = "crates/rraw-core" }
rraw-decode = { path = "crates/rraw-decode" }
rraw-optics = { path = "crates/rraw-optics" }
rraw-color = { path = "crates/rraw-color" }
rraw-gpu = { path = "crates/rraw-gpu" }
rraw-ai = { path = "crates/rraw-ai" }
rraw-storage = { path = "crates/rraw-storage" }
rraw-export = { path = "crates/rraw-export" }
rraw-macos-edr = { path = "crates/rraw-macos-edr" }
rraw-coreml = { path = "crates/rraw-coreml" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "avif"] }
zune-core = "0.5"
zune-jpegxl = "0.5"

[profile.dev.package.rawler]
opt-level = 3

[profile.dev.package.rraw-decode]
opt-level = 3

[profile.dev.package.rraw-color]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3

[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.rraw-app]
opt-level = 3

[profile.dev.package.zune-jpegxl]
opt-level = 3
